name: "🐛 Bug Report"
description: "File a bug report to help us improve VerdantGlass Terrarium Studio"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report an issue! Your feedback helps keep VerdantGlass Terrarium Studio thriving. 🌿"

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When adjusting the humidity slider beyond 85%, the glass condensation overlay flickers..."
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: "Platform / Operating System"
      description: "Which operating system did this occur on?"
      options:
        - "Windows 11 / 10"
        - "macOS"
        - "Linux"
        - "Android (Mobile / Tablet)"
        - "iOS / iPadOS"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: "Browser"
      description: "Which browser were you using?"
      options:
        - "Google Chrome"
        - "Microsoft Edge"
        - "Apple Safari"
        - "Mozilla Firefox"
        - "Brave / Chromium"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the issue."
      placeholder: "1. Launch studio at https://terrariumstudio.web.app\n2. Select Geometric Wardian Case\n3. Add Boston Fern specimen\n4. Observe..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs or Screenshots"
      description: "Paste relevant browser console error messages or attach screenshots here."
